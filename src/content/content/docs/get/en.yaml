title: How to define getters
introduction: |
  <b>Getters in Bob are used to retrieve data from tables in a flexible and expressive way.</b>
  You can specify exactly which fields you want, add conditions to filter your results,
  and even traverse relationships between tables by nesting getters. Getters allow for
  aliasing, calculated fields, filtering, relationship traversal, and grouping/aggregation.
  This section explains how to use the <b>get</b> statement to obtain the data you need,
  including how to group and aggregate records in your queries.

example: |
  # Retrieve fields from the 'Users' table
  get Users {
    id
    name
    email

    # An alias is defined using a name before the field
    last_name: family_name

    # 'meet' is a calculated field using a function. Here it concatenates "Hello " with the user's name
    # note: you still cannot reference fields previously saved as an alias.
    meet: concat("Hello ", name)

    # Filter users with a specific email
    if email = "test@test.com"

    # You can nest getters to retrieve related data 
    profile: get Profiles {
      if id = User->Profiles.id
      if avatar != "default.png"
    }

    # You can also use a join-like arrow syntax (->) to traverse relationships;
    # By default, the connection between tables uses the 'id' field.
    -> Profiles { 
      if avatar != "default.png"  
    }

    # You could also specify the join field
    -> Posts {
      if upvotes > 100
    }
  }

  # GROUP BY and aggregation: 
  # You can group results and perform calculations using group and aggregate functions (see playground example)
  get Posts {
    rating
    total_posts: count(id)
    group rating
    # Under a group condition, 'if' behaves like a SQL HAVING clause, filtering the grouped results.
    if total_posts > 10
  }

  # If you do an empty query, by default all fields are retrieved
  get Users {}
