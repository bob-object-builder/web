warning: Bob is under development! This is just a small proof of concept.
welcome:
  title: Meet <span class="text-primary">Bob</span>
  description: A lightweight declarative transpiler that converts <span class="rounded bg-primary/60 border-1 border-primary px-2">bob</span> DSL into SQL code for SQLite, MariaDB, and PostgreSQL. Write less boilerplate, maintain better database logic.
code: |
  $ bob -i users.bob -d sqlite -o ./sql/ <br />
  ✨ Successfully transpiled <br />
  🚀 Generated SQL for SQLite database!
start: Get started
github:
  claim: Github
  href: "https://github.com/bob-object-builder/bob"
claim:
  why: Why Choose Bob?
  answer: Bob combines the simplicity of modern syntax with the power of SQL, giving you the best of both worlds.
  reasons:
    - title: Declarative Syntax
      description: Define tables, fields, relationships, and queries in a clear and human-readable DSL format.
      icon: CodeIcon

    - title: Multi-Database Support
      description: Generate SQL for SQLite, MariaDB, and PostgreSQL with a single .bob file.
      icon: DatabaseIcon

    - title: Easy to Learn
      description: Bob's syntax is designed to be intuitive and easy to learn, making it accessible to developers of all skill levels.
      icon: WinkIcon

    - title: Horizontal ORM
      description: Use Bob as a syntax-driven ORM that integrates with any tech stack without imposing architectural constraints.
      icon: ArrowMoveRight

    - title: Built-in CLI
      description: Transpile, manage, and automate database workflows right from your terminal with Bob's CLI.
      icon: TerminalIcon

    - title: Powerful Query Language
      description: Create nested, grouped, and conditional queries without writing a single line of raw SQL.
      icon: BoltIcon
in_action:
  title: See Bob in Action
  description: Write expressive .bob code and let Bob handle the SQL generation for you.
  options:
    - Basic tables and queries
    - Aggregations and filters
    - Relationships and joins

philosophy:
  title: Philosophy
  description: Bob is built on the belief that working with databases should be simple, expressive, and independent of any specific backend or framework.
  principles:
    - Simplicity First
    - The syntax is intentionally minimal and readable to keep developers focused on what matters.
    - Technology Agnostic
    - Bob doesn't lock you into a specific language or framework—just clean database logic you can use anywhere.
    - Human-Centered Design
    - Models and queries should feel natural to write and easy to maintain, even years later.
    - Clear structures and transparent logic help prevent hidden bugs and misunderstandings.
    - Power Without Complexity
    - Bob offers advanced querying and relationships without requiring deep SQL knowledge.

types:
  title: Types
  description: Bob supports a variety of data types, including strings, numbers, booleans, and more.

output:
  text: |
    If you use the CLI, you can specify an output path (folder) for generating the project. <br>
    Bob will analyze all your files and generate the SQL in the specified path,
    separating tables and actions individually while preserving your original names.
  sql:
    - name: input
      type: folder
      children:
        - name: user.bob
          type: file
        - name: product.bob
          type: file
        - name: get-user-by-name.bob
          type: file
        - name: get-product-by-id.bob
          type: file
  bob:
    - name: output
      type: folder
      children:
        - name: tables.sql
          type: file
        - name: actions
          type: folder
          children:
            - name: get-user-by-name.sql
              type: file
            - name: get-product-by-id.sql
              type: file

howToWrite:
  title: How to Write Bob Files
  description: Learn how to write Bob to define your database schema and queries.

  tables: |
    table {tableName} {
      {columnName} {columnType}
    }

  getters: |
    get {tableName} {
      {columnName} or * | ... to retrieve everything

      # If you want to use and alias
      {aliasName}: {columnName}

      # Filtering
      if {columnName} {operator} {value}
      # You could concatenate multiple filters with the same operator to specified column name using && or ||
      if {columnName} {operator} {value} && {value}
      # to add and else you could use or above and if
      or {columnName} {operator} {value} || {value}

      # also you could use leftJoin using ->
      -> {tableName} {unionColumnName, "id" by default} {
        ...
      }

      # algo you could use subqueries
      ${aliasName}: get {tableName} {
        ...
      }
    }

  setters: |
    set {tableName} {
      {columnName} {newValue}
      # or
      {columnName}: {newValue}

      # Filtering
      if {columnName} {operator} {value}
      # You could concatenate multiple filters with the same operator to specified column name using && or ||
      if {columnName} {operator} {value} && {value}
      # to add and else you could use or above and if
      or {columnName} {operator} {value} || {value}
    }

  inserts: |
    new {tableName} {
      {columnName} {newValue}
      # or
      {columnName}: {newValue}
    }

    # bulk version
    new {tableName} {colunName} {colunName} ... {
      {value} {value} ...
    }

  deletes: |
    delete {tableName} {
      # Filtering
        if {columnName} {operator} {value}
        # You could concatenate multiple filters with the same operator to specified column name using && or ||
        if {columnName} {operator} {value} && {value}
        # to add and else you could use or above and if
        or {columnName} {operator} {value} || {value}
    }
