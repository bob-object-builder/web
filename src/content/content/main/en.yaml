welcome:
  title: Meet <span class="text-bob">Bob</span>
  description: 'Bob is a new way to write <b>SQL</b>. With <span class="rounded bg-bob/60 border-1 border-bob px-2">bob</span>, you can write a simple DSL that generates <b>SQL</b> for <b>SQLite</b>, <b>MariaDB</b>, and <b>Postgres</b>. Reduce boilerplate, simplify logic, and use the same lang across every ecosystem.'
  flags:
    cli: 
      CLI you can use anywhere
    sdk:
      CLI you can use anywhere



claim:
  why: Why Choose Bob?
  answer: Bob combines the simplicity of modern syntax with the power of SQL, giving you the best of both worlds.
  reasons:
    - title: Declarative Syntax
      description: Define tables, fields, relationships, and queries in a clear and human-readable DSL format.
      icon: CodeIcon

    - title: Multi-Database Support
      description: Generate SQL for SQLite, MariaDB, and PostgreSQL with a single .bob file.
      icon: DatabaseIcon

    - title: Easy to Learn
      description: Bob's syntax is designed to be intuitive and easy to learn, making it accessible to developers of all skill levels.
      icon: Laugh

    - title: Horizontal ORM
      description: Use Bob as a syntax-driven ORM that integrates with any tech stack without imposing architectural constraints.
      icon: ArrowRightToLine

    - title: Built-in CLI
      description: Transpile, manage, and automate database workflows right from your terminal with Bob's CLI.
      icon: TerminalIcon

    - title: Powerful Query Language
      description: Create nested, grouped, and conditional queries without writing a single line of raw SQL.
      icon: BoltIcon

cli:
  title: <span class="text-bob">CLI</span> TOOLS
  terminal:
    claim: Try our custom <b>CLI</b> to transpile easily your bob queries into <b>SQL</b>. It's super easy to use and super fast.
    code: |
      $ bob -i ./input/ -d sqlite -o ./sql/ <br />
      ✨ Successfully transpiled <br />
      🚀 Generated SQL for SQLite database!
  files:
    text: |
      If you use the CLI, you can specify an output path (folder) for generating the project. <br>
      Bob will analyze all your files and generate the SQL in the specified path,
      separating tables and actions individually while preserving your original names.
    sql:
      - name: input
        type: folder
        children:
          - name: user.bob
            type: file
          - name: product.bob
            type: file
          - name: get-user-by-name.bob
            type: file
          - name: get-product-by-id.bob
            type: file
    bob:
      - name: output
        type: folder
        children:
          - name: tables.sql
            type: file
          - name: actions
            type: folder
            children:
              - name: get-user-by-name.sql
                type: file
              - name: get-product-by-id.sql
                type: file


playground:
  title: <span class="text-bob">PLAY</span>GROUND